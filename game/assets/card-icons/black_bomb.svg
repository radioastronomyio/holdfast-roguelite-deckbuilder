<svg data-holdfast-derived-from="black_bomb" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <metadata>Holdfast recolour derived from Runic Relic RPG Icons 144 (black_bomb, bomb mode).</metadata>
  <defs>
    <filter id="drop" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#050308" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f3e2b3" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="black_bomb_rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3e2b3"/>
    <stop offset="0.55" stop-color="#73c96d"/>
    <stop offset="1" stop-color="#4ac1b7"/>
  </linearGradient>
    <linearGradient id="black_bomb_fill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34313a"/>
    <stop offset="0.55" stop-color="#211e27"/>
    <stop offset="1" stop-color="#141118"/>
  </linearGradient>
    <radialGradient id="black_bomb_light" cx="46%" cy="33%" r="72%">
      <stop offset="0" stop-color="#4ac1b7" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#211e27" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#141118" stop-opacity="0.98"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>
    <g filter="url(#drop)">
      <rect x="18" y="18" width="220" height="220" rx="48" fill="#09070c"/>
      <rect x="26" y="26" width="204" height="204" rx="42" fill="url(#black_bomb_fill)" stroke="url(#black_bomb_rim)" stroke-width="7"/>
      <circle cx="128" cy="128" r="78" fill="url(#black_bomb_light)" stroke="#73c96d" stroke-width="4" opacity="0.95"/>
      <circle cx="128" cy="128" r="96" fill="none" stroke="#f3e2b3" stroke-width="2" opacity="0.24"/>
      <path d="M42 210 L58 226 M198 30 L214 46" stroke="#4ac1b7" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <g filter="url(#glow)"><circle cx="122" cy="142" r="56" fill="#73c96d" stroke="#141118" stroke-width="9"/><path d="M154 96 C166 58 194 56 204 78" stroke="#f3e2b3" stroke-width="9" stroke-linecap="round"/><path d="M190 62 L208 44" stroke="#4ac1b7" stroke-width="8" stroke-linecap="round"/></g>
