<svg data-holdfast-derived-from="poison_cloud" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <metadata>Holdfast recolour derived from Runic Relic RPG Icons 144 (poison_cloud, poison mode).</metadata>
