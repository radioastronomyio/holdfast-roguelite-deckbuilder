<svg data-holdfast-derived-from="fireball" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <metadata>Holdfast recolour derived from Runic Relic RPG Icons 144 (fireball, flame mode).</metadata>
  <defs>
    <filter id="drop" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#050308" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f3e2b3" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="fireball_rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3e2b3"/>
    <stop offset="0.55" stop-color="#9d3f4d"/>
    <stop offset="1" stop-color="#c49a43"/>
  </linearGradient>
    <linearGradient id="fireball_fill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34313a"/>
    <stop offset="0.55" stop-color="#211e27"/>
    <stop offset="1" stop-color="#141118"/>
  </linearGradient>
    <radialGradient id="fireball_light" cx="46%" cy="33%" r="72%">
      <stop offset="0" stop-color="#c49a43" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#211e27" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#141118" stop-opacity="0.98"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>
    <g filter="url(#drop)">
      <rect x="18" y="18" width="220" height="220" rx="48" fill="#09070c"/>
      <rect x="26" y="26" width="204" height="204" rx="42" fill="url(#fireball_fill)" stroke="url(#fireball_rim)" stroke-width="7"/>
      <circle cx="128" cy="128" r="78" fill="url(#fireball_light)" stroke="#9d3f4d" stroke-width="4" opacity="0.95"/>
      <circle cx="128" cy="128" r="96" fill="none" stroke="#f3e2b3" stroke-width="2" opacity="0.24"/>
      <path d="M36 128 H54 M202 128 H220" stroke="#c49a43" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <g filter="url(#glow)"><path d="M128 216 C78 184 86 132 118 98 C120 70 148 50 160 36 C158 76 188 92 190 134 C194 182 164 208 128 216 Z" fill="#9d3f4d" stroke="#141118" stroke-width="9"/><path d="M130 188 C110 166 124 136 146 112 C144 146 168 154 146 188 Z" fill="#f3e2b3" opacity="0.65"/></g>
    </g>
