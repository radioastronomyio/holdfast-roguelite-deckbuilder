    <linearGradient id="tower_shield_rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3e2b3"/>
    <stop offset="0.55" stop-color="#c49a43"/>
    <stop offset="1" stop-color="#f3e2b3"/>
  </linearGradient>
