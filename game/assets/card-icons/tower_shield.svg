<svg data-holdfast-derived-from="tower_shield" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <metadata>Holdfast recolour derived from Runic Relic RPG Icons 144 (tower_shield, shield mode).</metadata>
  <defs>
    <filter id="drop" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#050308" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
