      <g filter="url(#glow)"><path d="M128 42 L184 62 V112 C184 160 158 194 128 214 C98 194 72 160 72 112 V62 Z" fill="#c49a43" stroke="#141118" stroke-width="9" stroke-linejoin="round"/><path d="M128 58 V194 M88 94 H168" stroke="#f3e2b3" stroke-width="6" opacity="0.65"/></g>
